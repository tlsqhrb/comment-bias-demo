<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>댓글 프레이밍 편향 분석 데모 (YouTube 전용)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #f5f5f7;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111827;
      color: #f9fafb;
      padding: 20px 24px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    header p {
      margin: 6px 0 0;
      font-size: 14px;
      color: #9ca3af;
    }
    main {
      max-width: 800px;
      margin: 24px auto 40px;
      padding: 0 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
      color: #111827;
    }
    .card p.desc {
      margin: 0 0 12px;
      font-size: 13px;
      color: #6b7280;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #374151;
      font-weight: 500;
    }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background-color: #f9fafb;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.2);
      background-color: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
      max-height: 200px;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }
    button.primary {
      background: #2563eb;
      color: #ffffff;
    }
    button.primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .result-section {
      margin-top: 14px;
      border-top: 1px solid #e5e7eb;
      padding-top: 10px;
    }
    .ratio-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
    }
    .tag.pro {
      background: #dcfce7;
      color: #15803d;
    }
    .tag.con {
      background: #fee2e2;
      color: #b91c1c;
    }
    .tag.neutral {
      background: #e5e7eb;
      color: #374151;
    }
    .comment-item {
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 6px 8px;
      margin-bottom: 6px;
      background-color: #f9fafb;
    }
    .comment-item p {
      margin: 0;
      font-size: 13px;
    }
    .comment-stance {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }
    .muted {
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>
<body>
<header>
  <h1>댓글 프레이밍 편향 분석 데모 (YouTube)</h1>
  <p>먼저 나의 의견을 기록한 뒤, 유튜브 댓글을 분석하여 찬·반·중립 분포를 확인하는 도구입니다.</p>
</header>

<main>
  <section class="card">
    <h2>YouTube 영상 댓글 분석</h2>
    <p class="desc">
      분석하고 싶은 <strong>영상의 URL 또는 ID</strong>를 입력하고, 먼저 나의 의견을 적어보세요.<br>
      서버는 해당 영상의 댓글을 가져와 찬성/반대/중립 비율을 계산합니다.
    </p>

    <label for="videoIdInput">YouTube 영상 URL 또는 ID</label>
    <input
      type="text"
      id="videoIdInput"
      placeholder="예: https://www.youtube.com/watch?v=dQw4w9WgXcQ 또는 dQw4w9WgXcQ"
    />

    <label for="myOpinion">내 의견 먼저 기록하기</label>
    <textarea
      id="myOpinion"
      placeholder="댓글을 보기 전에, 이 이슈/영상에 대한 나의 생각을 짧게 적어보세요."
    ></textarea>

    <button class="primary" id="runYoutubeBtn">
      댓글 분석 시작
    </button>
    <span class="small">서버: <code>POST /opinion/youtube</code> 호출</span>

    <div class="result-section" id="youtubeResult" style="display:none;">
      <h3 style="font-size:14px; margin:0 0 8px;">분석 결과</h3>
      <div id="ratioBox" class="ratio-row"></div>
      <div id="commentList"></div>
    </div>

    <div id="youtubeError" class="small" style="color:#b91c1c; margin-top:6px;"></div>
  </section>
</main>

<script>
  // URL 또는 ID에서 11자리 videoId 추출
  function extractVideoId(input) {
    input = input.trim();
    if (!input) return "";

    // 1) URL 형태인 경우
    try {
      if (input.startsWith("http")) {
        const url = new URL(input);

        // https://youtu.be/VIDEOID
        if (url.hostname === "youtu.be") {
          const path = url.pathname; // 예: /ZJWQSgriJSM
          const id = path.replace("/", "");
          if (id.length >= 10) return id;
        }

        // https://www.youtube.com/watch?v=VIDEOID
        const v = url.searchParams.get("v");
        if (v && v.length >= 10) {
          return v;
        }
      }
    } catch (e) {
      // URL 파싱 실패 시 아래 정규식으로 fallback
    }

    // 2) 그냥 11글자짜리 ID이거나, 문자열 안에 섞여 있는 경우
    const match = input.match(/([a-zA-Z0-9_-]{11})/);
    if (match) {
      return match[1];
    }

    // 3) 실패
    return "";
  }

  const runYoutubeBtn = document.getElementById("runYoutubeBtn");
  const youtubeResult = document.getElementById("youtubeResult");
  const youtubeError = document.getElementById("youtubeError");
  const ratioBox = document.getElementById("ratioBox");
  const commentList = document.getElementById("commentList");

  runYoutubeBtn.addEventListener("click", async () => {
    youtubeError.textContent = "";
    youtubeResult.style.display = "none";
    ratioBox.innerHTML = "";
    commentList.innerHTML = "";

    const rawVideoInput = document.getElementById("videoIdInput").value.trim();
    const videoId = extractVideoId(rawVideoInput);

    const opinion = document.getElementById("myOpinion").value.trim();

    if (!videoId) {
      youtubeError.textContent = "유효한 YouTube 영상 URL 또는 ID를 입력해주세요.";
      return;
    }
    if (!opinion) {
      youtubeError.textContent = "댓글을 보기 전에, 나의 의견을 한 줄이라도 적어보는 것을 권장합니다.";
      return;
    }

    try {
      const res = await fetch("http://127.0.0.1:8000/opinion/youtube", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          video_id: videoId,
          user_id: "anonymous",       // 사용자 ID 입력 없이 항상 anonymous로 전송
          opinion_text: opinion,
        }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        youtubeError.textContent =
          "서버 오류가 발생했습니다: " + (errData.detail || res.statusText);
        return;
      }

      const data = await res.json();
      // data: { post_id, my_opinion, comments: [{text, stance}], ratio: {pro,con,neutral} }

      youtubeResult.style.display = "block";

      const pro = (data.ratio.pro * 100).toFixed(1);
      const con = (data.ratio.con * 100).toFixed(1);
      const neu = (data.ratio.neutral * 100).toFixed(1);

      ratioBox.innerHTML = `
        <span class="tag pro">찬성 ${pro}%</span>
        <span class="tag con">반대 ${con}%</span>
        <span class="tag neutral">중립 ${neu}%</span>
      `;

      if (Array.isArray(data.comments) && data.comments.length > 0) {
        data.comments.forEach((c) => {
          const div = document.createElement("div");
          div.className = "comment-item";
          div.innerHTML = `
            <p>${c.text}</p>
            <div class="comment-stance">
              입장: 
              ${
                c.stance === "pro"
                  ? '<span class="tag pro">찬성</span>'
                  : c.stance === "con"
                  ? '<span class="tag con">반대</span>'
                  : '<span class="tag neutral">중립</span>'
              }
            </div>
          `;
          commentList.appendChild(div);
        });
      } else {
        commentList.innerHTML = `<p class="muted">가져온 댓글이 없습니다.</p>`;
      }
    } catch (err) {
      console.error(err);
      youtubeError.textContent = "요청 중 오류가 발생했습니다. FastAPI 서버가 켜져 있는지 확인해주세요.";
    }
  });
</script>
</body>
</html>
